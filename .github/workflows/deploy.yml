name: Build, test, and deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, test, and publish artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-build
          path: dist
          retention-days: 14

      - name: Publish coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 14

  uat:
    name: UAT
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ejecutar UAT
        run: npm run test:uat

      - name: Publicar resultado de UAT
        uses: actions/upload-artifact@v4
        with:
          name: uat-results
          path: test-results
          retention-days: 14

  deploy-dev:
    name: Deploy dev Worker
    needs: uat
    runs-on: ubuntu-latest
    environment:
      name: dev
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: worker-build
          path: dist

      - name: Publish to Cloudflare dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env dev

  deploy-production:
    name: Deploy production Worker
    needs: deploy-dev
    runs-on: ubuntu-latest
    # Waits on the "Review deployments" button until a required reviewer
    # clicks "Approve and deploy" (GitHub → Settings → Environments → production).
    environment:
      name: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: worker-build
          path: dist

      - name: Publish to Cloudflare production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
